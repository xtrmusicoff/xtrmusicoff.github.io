<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>10TR presents</title>
  <style>
    @font-face { font-family: Unbounded; src: url("fonts/Unbounded-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: Unbounded; src: url("fonts/Unbounded-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
    @font-face { font-family: Unbounded; src: url("fonts/Unbounded-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

    :root { color-scheme: dark; --accent: #f54927; --white: #fff; --muted: #858585; --bg: #111; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100svh; overflow: hidden; background: var(--bg); color: var(--white); font-family: Unbounded, sans-serif; }
    .scene { position: relative; display: grid; min-height: 100svh; place-items: center; isolation: isolate; overflow: hidden; padding: 32px 24px; }
    .scene::before { position: absolute; z-index: -2; inset: -25%; content: ""; background: radial-gradient(ellipse at 50% 48%, #30211e 0%, #1a1716 31%, #111 65%); animation: breathe 8s ease-in-out infinite alternate; }
    .scene::before { background: radial-gradient(ellipse at 50% 48%, #30211e 0%, #1a1716 31%, #111 65%); }
    .dot-grid { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .5; mask-image: radial-gradient(ellipse at center, #000 10%, transparent 78%); }
    .scene::after { position: absolute; z-index: -1; inset: 0; content: ""; opacity: .16; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E"); }
    .intro, .main { grid-area: 1 / 1; text-align: center; }
    .orbit { position: absolute; z-index: -1; top: 50%; left: 50%; width: min(76vw, 700px); aspect-ratio: 1; border: 1px solid #ffffff0b; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; animation: orbit-turn 36s linear infinite; }
    .orbit::before, .orbit::after { position: absolute; content: ""; border-radius: 50%; background: var(--accent); box-shadow: 0 0 22px 5px #f5492740; }
    .orbit::before { top: 15%; left: 12%; width: 5px; height: 5px; }
    .orbit::after { right: 9%; bottom: 20%; width: 3px; height: 3px; opacity: .65; }
    .spark { position: absolute; z-index: -1; width: 8px; height: 8px; border: 1px solid #f5492770; transform: rotate(45deg); pointer-events: none; animation: drift 7s ease-in-out infinite alternate; }
    .spark-one { top: 24%; right: 17%; }
    .spark-two { bottom: 22%; left: 19%; width: 5px; height: 5px; animation-delay: -3s; }
    .intro { display: flex; flex-direction: column; align-items: center; gap: 26px; animation: intro-out 1.1s ease 3.6s forwards; }
    .logo { display: block; width: clamp(110px, 19vw, 190px); height: auto; filter: drop-shadow(0 12px 35px #f5492730); animation: logo-in 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .present { margin: 0; color: #fff; font-size: clamp(12px, 1.5vw, 16px); font-weight: 500; letter-spacing: .32em; text-transform: uppercase; animation: shimmer 2.8s ease-in-out 1s infinite; }
    .main { width: min(100%, 900px); opacity: 0; transform: translateY(18px); animation: main-in .8s ease 4.65s forwards; }
    h1 { display: flex; flex-wrap: wrap; justify-content: center; column-gap: .22em; row-gap: .02em; margin: 0; font-size: clamp(34px, 8vw, 82px); line-height: 1; font-weight: 700; letter-spacing: -.065em; }
    .word { display: inline-block; opacity: 0; transform: translateY(24px); animation: word-in .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .word:nth-child(1) { animation-delay: 5.15s; }
    .word:nth-child(2) { animation-delay: 5.48s; }
    .word:nth-child(3) { animation-delay: 5.81s; }
    .accent { color: var(--accent); }
    .subtitle { margin: 20px 0 0; color: var(--muted); font-size: clamp(13px, 2vw, 17px); letter-spacing: .045em; opacity: 0; animation: fade-up .65s ease 6.35s forwards; }
    .action { position: relative; overflow: hidden; min-width: 184px; margin-top: 42px; padding: 16px 28px; border: 0; border-radius: 999px; background: var(--accent); color: var(--white); font: 500 13px Unbounded, sans-serif; letter-spacing: .04em; cursor: pointer; opacity: 0; transform: translateY(12px); animation: fade-up .65s ease 6.7s forwards, button-glow 3s ease-in-out 7.35s infinite; transition: background .2s ease, box-shadow .2s ease; }
    .action::before { position: absolute; inset: -60% auto -60% -40%; width: 25%; content: ""; background: linear-gradient(90deg, transparent, #ffffff60, transparent); transform: skewX(-20deg); animation: button-sheen 4.5s ease-in-out 8s infinite; }
    .action span { position: relative; }
    .ripple { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #ffffff75; transform: translate(-50%, -50%) scale(0); animation: ripple .65s ease-out forwards; pointer-events: none; }
    .action:hover { transform: translateY(-3px) scale(1.025); background: #ff6242; box-shadow: 0 12px 38px #f5492760; }
    .action:disabled { cursor: wait; background: #a33b29; animation: fade-up .65s ease 6.7s forwards; }
    .action:active { transform: scale(.97); }
    .action:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    .message { min-height: 1.5em; margin: 26px 0 0; color: var(--white); font-size: clamp(14px, 2vw, 18px); line-height: 1.7; opacity: 0; transition: opacity .5s ease, transform .5s ease; transform: translateY(5px); }
    .message.visible { opacity: 1; transform: translateY(0); }
    .message.fading { opacity: 0; transform: translateY(-7px); }
    .message span { display: block; animation: message-in .45s ease both; }
    @keyframes breathe { from { transform: scale(1); opacity: .72; } to { transform: scale(1.12); opacity: 1; } }
    @keyframes orbit-turn { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes drift { from { opacity: .2; translate: 0 8px; } to { opacity: .85; translate: 0 -12px; } }
    @keyframes button-sheen { 0%, 70% { left: -40%; } 100% { left: 130%; } }
    @keyframes ripple { to { opacity: 0; transform: translate(-50%, -50%) scale(18); } }
    @keyframes logo-in { from { opacity: 0; transform: translateY(22px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes intro-out { to { opacity: 0; transform: scale(.97); visibility: hidden; } }
    @keyframes main-in { to { opacity: 1; transform: none; } }
    @keyframes word-in { to { opacity: 1; transform: none; } }
    @keyframes fade-up { to { opacity: 1; transform: none; } }
    @keyframes message-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes button-glow { 0%, 100% { box-shadow: 0 0 0 0 #f5492700; } 50% { box-shadow: 0 0 30px 2px #f5492735; } }
    @media (max-width: 480px) { .intro { gap: 20px; } .action { margin-top: 34px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <canvas class="dot-grid" aria-hidden="true"></canvas>
    <div class="orbit" aria-hidden="true"></div>
    <i class="spark spark-one" aria-hidden="true"></i>
    <i class="spark spark-two" aria-hidden="true"></i>
    <section class="intro" aria-label="10TR presents">
      <img class="logo" src="images/logo_transparent.png" alt="10TR">
      <p class="present">10TR presents</p>
    </section>
    <section class="main" aria-label="Sample page">
      <h1><span class="word">Ready</span><span class="word accent">when</span><span class="word accent">you are</span></h1>
      <p class="subtitle">sample HTML page</p>
      <button class="action" id="action" type="button"><span>Click me</span></button>
      <p class="message" id="message" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
  <script>
    (() => {
      const button = document.getElementById('action');
      const message = document.getElementById('message');
      const scene = document.querySelector('.scene');
      let clickCount = 0;
      let clickTimer;
      let messageTimer;
      let sequenceBusy = false;

      function show(lines) {
        clearTimeout(messageTimer);
        sequenceBusy = true;
        button.disabled = true;
        message.classList.remove('fading');
        let index = 0;
        const showNext = () => {
          if (index >= lines.length) {
            message.classList.add('fading');
            messageTimer = setTimeout(() => {
              message.classList.remove('visible', 'fading');
              sequenceBusy = false;
              button.disabled = false;
            }, 500);
            return;
          }
          if (message.classList.contains('visible')) {
            message.classList.add('fading');
            messageTimer = setTimeout(renderNext, 500);
            return;
          }
          renderNext();
        };
        const renderNext = () => {
          const span = document.createElement('span');
          span.textContent = lines[index++];
          message.replaceChildren(span);
          message.classList.remove('fading');
          message.classList.add('visible');
          messageTimer = setTimeout(showNext, 2000);
        };
        renderNext();
      }

      button.addEventListener('click', () => {
        if (sequenceBusy) return;
        clickCount = Math.min(clickCount + 1, 3);
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => {
          if (clickCount === 1) show(['Hello, world!']);
          else if (clickCount === 2) show(['Created by 10TR', 'and coded by Codex', 'instagram.com/@xtrmusicoff']);
          else if (clickCount === 3) window.location.href = 'https://open.spotify.com/artist/2tXbTzvCAksgCwA7FoSufk';
          clickCount = 0;
        }, 500);
      });

      button.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        clearTimeout(clickTimer);
        clickCount = 0;
        show(['Try to click button once, twice or thrice.']);
      });

      const canvas = document.querySelector('.dot-grid');
      const context = canvas.getContext('2d');
      const spacing = 28;
      const radius = 150;
      const pointer = { x: -1000, y: -1000, active: false };
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let animationFrame = 0;

      function resizeGrid() {
        const bounds = scene.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        drawGrid();
      }

      function drawGrid() {
        context.clearRect(0, 0, width, height);
        const offset = spacing / 2;
        for (let y = offset; y < height; y += spacing) {
          for (let x = offset; x < width; x += spacing) {
            const dx = x - pointer.x;
            const dy = y - pointer.y;
            const distance = Math.hypot(dx, dy);
            const influence = pointer.active ? Math.max(0, 1 - distance / radius) * (pointer.release ?? 1) : 0;
            // Repel nearby dots; displacement fades to zero at the fixed radius.
            const slope = influence * influence * 21;
            const nx = distance ? dx / distance : 0;
            const ny = distance ? dy / distance : 0;
            const red = Math.round(255 - 10 * influence);
            const green = Math.round(255 - 182 * influence);
            const blue = Math.round(255 - 216 * influence);
            const alpha = .5 + influence * .46;
            context.beginPath();
            context.fillStyle = `rgba(${red}, ${green}, ${blue}, ${alpha})`;
            context.arc(x + nx * slope, y + ny * slope, 1.15 + influence * .4, 0, Math.PI * 2);
            context.fill();
          }
        }
      }

      scene.addEventListener('pointermove', (event) => {
        cancelAnimationFrame(animationFrame);
        const bounds = scene.getBoundingClientRect();
        pointer.x = event.clientX - bounds.left;
        pointer.y = event.clientY - bounds.top;
        pointer.active = true;
        drawGrid();
      });
      scene.addEventListener('pointerleave', () => {
        // Keep the release center on the canvas even if the pointer exited between frames.
        pointer.x = Math.max(0, Math.min(width, pointer.x));
        pointer.y = Math.max(0, Math.min(height, pointer.y));
        const start = performance.now();
        const releaseDuration = 650;
        const release = (now) => {
          const progress = Math.min(1, (now - start) / releaseDuration);
          const eased = progress * progress * (3 - 2 * progress);
          pointer.release = 1 - eased;
          drawGrid();
          if (progress < 1) animationFrame = requestAnimationFrame(release);
          else { pointer.active = false; pointer.x = -1000; pointer.y = -1000; pointer.release = 1; }
        };
        pointer.release = 1;
        animationFrame = requestAnimationFrame(release);
      });
      window.addEventListener('resize', resizeGrid);
      resizeGrid();

      button.addEventListener('pointerdown', (event) => {
        const bounds = button.getBoundingClientRect();
        const ripple = document.createElement('i');
        ripple.className = 'ripple';
        ripple.style.left = `${event.clientX - bounds.left}px`;
        ripple.style.top = `${event.clientY - bounds.top}px`;
        button.append(ripple);
        ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
      });
    })();
  </script>
</body>
</html>
